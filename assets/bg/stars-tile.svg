<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">
  <title>Tähtitaustatiili</title>
  <!--
    Saumaton 140 × 140 taustatiili. Tehty itse, koska tiilen pitää
    toistua saumattomasti — arkistokuvat eivät sitä tee.

    Saumattomuus on varmistettu yksinkertaisesti: kaikki tähdet on
    piirretty selvästi reunojen sisäpuolelle, joten mikään muoto ei
    leikkaudu tiilen rajalla eikä saumaa synny. Jos siirrät tähtiä,
    pidä ne vähintään 8 px päässä reunoista.

    Tausta on läpinäkyvä, jotta body:n taustaväri (CSS-muuttuja navy)
    näkyy läpi ja värin voi vaihtaa yhdestä paikasta.

    HUOM: SVG on XML, eikä XML-kommentissa saa esiintyä kahta
    peräkkäistä tavuviivaa. CSS-muuttujiin ei siis voi viitata
    kommentissa niiden oikeassa muodossa — tiedosto ei jäsentyisi
    lainkaan, ja selain jättäisi koko kuvan lataamatta.
  -->
  <g fill="#ffffff">
    <circle cx="24"  cy="30"  r="1.1"/>
    <circle cx="97"  cy="18"  r="0.9"/>
    <circle cx="61"  cy="74"  r="1"/>
    <circle cx="118" cy="96"  r="1.2"/>
    <circle cx="38"  cy="117" r="0.9"/>
    <circle cx="83"  cy="121" r="1"/>
  </g>
  <g fill="#00ffff">
    <circle cx="112" cy="46" r="1.3"/>
    <circle cx="17"  cy="83" r="1.1"/>
  </g>
  <!-- Pari isompaa nelisakaraista tähteä. -->
  <g fill="#ffff00">
    <path d="M70 22 l1.6 4.6 4.6 1.6 -4.6 1.6 -1.6 4.6 -1.6 -4.6 -4.6 -1.6 4.6 -1.6 z"/>
    <path d="M44 66 l1.2 3.4 3.4 1.2 -3.4 1.2 -1.2 3.4 -1.2 -3.4 -3.4 -1.2 3.4 -1.2 z"/>
  </g>
  <g fill="#ff00cc">
    <path d="M100 108 l1.3 3.8 3.8 1.3 -3.8 1.3 -1.3 3.8 -1.3 -3.8 -3.8 -1.3 3.8 -1.3 z"/>
  </g>
</svg>
