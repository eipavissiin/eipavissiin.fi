<svg xmlns="http://www.w3.org/2000/svg" width="64" height="20" viewBox="0 0 64 20" role="img" aria-label="WOW!">
  <title>WOW!</title>
  <!--
    Vilkkuva merkki, samaa sarjaa kuin new-badge.svg.

    Vilkkuminen on CSS-animaatio SVG:n sisällä (ei SMIL), jotta
    prefers-reduced-motion voidaan huomioida. Media query toimii myös
    silloin kun tiedosto on <img src>:n takana.

    HUOM: XML-kommentissa ei saa olla kahta perakkaista tavuviivaa.
  -->
  <style>
    .blink { animation: b 1.1s steps(1, end) infinite; }
    @keyframes b { 0%, 55% { opacity: 1; } 55.01%, 100% { opacity: 0.25; } }
    @media (prefers-reduced-motion: reduce) {
      .blink { animation: none; opacity: 1; }
    }
  </style>
  <g class="blink">
    <rect x="0.5" y="0.5" width="63" height="19" fill="#9900ff" stroke="#00ffff" stroke-width="1"/>
    <text x="32.0" y="14.5"
          font-family="Verdana, Geneva, sans-serif" font-size="11" font-weight="bold"
          fill="#ffff00" text-anchor="middle" letter-spacing="0.5">WOW!</text>
  </g>
</svg>
