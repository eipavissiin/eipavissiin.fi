<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eipä Vissiin! 2026 — tarra (60 mm)</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/css/sticker.css">
</head>

<body>

<!-- Ei tulostu. -->
<div class="toolbar">
  <p class="toolbar__text">
    Pyöreä tarra, <strong>leikkauskoko 60 mm</strong>, leikkuuvaralla 66 mm.
    Tulosta tai tallenna PDF:ksi: <strong>Ctrl/Cmd&nbsp;+&nbsp;P</strong> →
    kohde <em>Tallenna PDF:nä</em> → marginaalit <em>ei mitään</em> →
    taustagrafiikat <em>päälle</em>.
    Apuympyrät näkyvät vain ruudulla, eivät tulosteessa.
  </p>
  <button class="toolbar__btn" type="button" onclick="window.print()">Tulosta / PDF</button>
  <a class="toolbar__btn" href="/">← Sivustolle</a>
</div>

<div class="stage">
  <div class="sticker">

    <div class="sticker__inner">
      <img class="sticker__star" src="/assets/clipart/star.svg" alt="" width="60" height="60">

      <p class="sticker__title">
        <span class="sticker__title-a">Eipä</span>
        <span class="sticker__title-b">Vissiin!</span>
      </p>

      <div class="sticker__rule"></div>

      <p class="sticker__year">2026</p>
      <p class="sticker__url">EIPAVISSIIN.FI</p>
    </div>

    <!--
      Apuympyrät: vain ruudulle. Ulompi = leikkauslinja 60 mm,
      sisempi = turva-alue 50 mm. Pidä kaikki teksti sisemmän sisällä —
      pyöreässä tarrassa leikkuri heittää aina hieman.
    -->
    <div class="guide guide--cut" aria-hidden="true"></div>
    <div class="guide guide--safe" aria-hidden="true"></div>
  </div>
</div>

</body>
</html>
